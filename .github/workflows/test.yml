name: test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'

env:
  BUILD_TAG: nextcloud:test
  CONTAINER_NAME: nextcloud

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        docker_file:
          - v32.Dockerfile
          - v33.Dockerfile
          - v34.Dockerfile
        dir:
          - mysql
          - pgsql
          - sqlite
    steps:
      -
        name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      -
        name: Build
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          targets: image-local
        env:
          DEFAULT_TAG: ${{ env.BUILD_TAG }}
          DOCKERFILE: ${{ matrix.docker_file }}
      -
        name: Start
        run: |
          docker compose up -d
        working-directory: test/${{ matrix.dir }}
        env:
          NEXTCLOUD_IMAGE: ${{ env.BUILD_TAG }}
          NEXTCLOUD_CONTAINER: ${{ env.CONTAINER_NAME }}
      -
        name: Check container logs
        uses: crazy-max/.github/.github/actions/container-logs-check@46267a6e61cd56aac2fc79943df180152f4c89d6 # v1.10.1
        with:
          name: ${{ env.CONTAINER_NAME }}
          log_check: "ready to handle connections"
      -
        name: Logs
        if: always()
        run: |
          docker compose logs
        working-directory: test/${{ matrix.dir }}
        env:
          NEXTCLOUD_IMAGE: ${{ env.BUILD_TAG }}
          NEXTCLOUD_CONTAINER: ${{ env.CONTAINER_NAME }}
