name: test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches:
      - 'master'
  pull_request:

env:
  BUILD_TAG: nextcloud:test
  CONTAINER_NAME: nextcloud
  PUID: "1234"
  PGID: "1235"

jobs:
  test:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        dir:
          - mysql
          - pgsql
          - sqlite
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      -
        name: Build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: image-local
        env:
          DEFAULT_TAG: ${{ env.BUILD_TAG }}
      -
        name: Start
        run: |
          docker compose up -d --wait --wait-timeout 120
        working-directory: test/${{ matrix.dir }}
        env:
          NEXTCLOUD_IMAGE: ${{ env.BUILD_TAG }}
          NEXTCLOUD_CONTAINER: ${{ env.CONTAINER_NAME }}
      -
        name: Check container logs
        uses: crazy-max/.github/.github/actions/container-logs-check@f91220cba053bd54299ba645a599ee8ed436f222 # v1.11.0
        with:
          name: ${{ env.CONTAINER_NAME }}
          log_check: "ready to handle connections"
      -
        name: Check services
        run: |
          docker compose exec -T nextcloud sh -s < ../services.sh
          docker compose exec -T cron sh -s < ../services.sh
          docker compose exec -T previewgen sh -s < ../services.sh
        working-directory: test/${{ matrix.dir }}
        env:
          NEXTCLOUD_IMAGE: ${{ env.BUILD_TAG }}
          NEXTCLOUD_CONTAINER: ${{ env.CONTAINER_NAME }}
      -
        name: Logs
        if: always()
        run: |
          docker compose logs
        working-directory: test/${{ matrix.dir }}
        env:
          NEXTCLOUD_IMAGE: ${{ env.BUILD_TAG }}
          NEXTCLOUD_CONTAINER: ${{ env.CONTAINER_NAME }}
